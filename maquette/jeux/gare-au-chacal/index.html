<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gare au Chacal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&family=Patrick+Hand&display=swap">
<style>
/* VOICE: soirée jeux à la ferme, chaleureux, ludique
   IDEA: une grande table en bois sous la lampe, chacun pose ses cartes devant lui
   PICTURE: la table elle-même : bots à gauche et à droite, pioche au centre, toi en bas
   COLOUR and TYPE: bois miel, nappes de lin, tableau noir, carnet ; Baloo 2, Nunito, Patrick Hand
   LAYOUT: table au centre, carnet de partie en colonne haute à droite, tableau des points dessous */
:root{color-scheme:dark;--room:#21160f;--wood:#a8703d;--woodd:#6c421f;--linen:#efe2bf;--ink:#2b2014;--cream:#f6ecd2;
--muted:#8a7756;--red:#c8402f;--gold:#f2c14e;--chalk:#24342b}
*{box-sizing:border-box;min-width:0}
body{margin:0;color:var(--cream);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;
background:radial-gradient(ellipse 70% 55% at 40% 32%,#5a3d27 0,#2c1e14 55%,#1a110b 100%) fixed,var(--room)}
h1,h2,h3{font-family:"Baloo 2",Nunito,sans-serif;line-height:1.05;margin:0}
.top{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;padding:8px 18px}
.backsite{color:var(--cream);font-weight:800;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;padding:0 6px}.backsite:hover{color:var(--gold)}
.introback{position:absolute;top:12px;left:16px;color:#4a2f14;background:#fffaf0;border:2px solid #6c421f;border-radius:12px;padding:8px 14px;font-weight:800;text-decoration:none;z-index:2}.introback:hover{background:#fff}
.top h1{font-size:clamp(28px,3.4vw,40px);color:var(--gold);text-shadow:0 3px 0 #6c421f}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:15px;font-weight:700}
select,button{font:inherit;font-weight:800;border-radius:12px;border:2px solid #3b2614;background:var(--cream);color:var(--ink);min-height:44px;padding:6px 14px;cursor:pointer;box-shadow:0 3px 0 #3b2614}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #3b2614}
button.main{background:var(--red);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
label.chk{display:flex;gap:6px;align-items:center;min-height:44px}label.chk input{width:20px;height:20px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;padding:0 18px 18px;align-items:start}

/* ---- la table ---- */
.table{position:relative;border-radius:40px;padding:16px;border:12px solid var(--woodd);display:grid;gap:12px;
background:linear-gradient(180deg,rgba(255,230,180,.18),rgba(0,0,0,.12)),repeating-linear-gradient(90deg,#a8703d 0 118px,#8e5a2e 118px 121px,#b07943 121px 240px,#8e5a2e 240px 243px);
box-shadow:inset 0 0 50px rgba(0,0,0,.45),0 24px 50px rgba(0,0,0,.55)}
.t1{grid-template-columns:minmax(0,1fr);grid-template-areas:"s1" "mid" "me"}
.t2{grid-template-columns:minmax(0,1fr) minmax(0,.9fr) minmax(0,1fr);grid-template-areas:"s1 mid s2" "me me me"}
.t3{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);grid-template-areas:"s1 s2 s3" "s1 mid s3" "me me me"}
.t4{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-areas:"s1 s2 s3 s4" "s1 mid mid s4" "me me me me"}
.seat{background:linear-gradient(var(--linen),#e4d3a8);color:var(--ink);border-radius:18px;padding:10px 12px 14px;box-shadow:0 4px 0 rgba(0,0,0,.25);border:3px solid transparent;transition:border-color .3s,box-shadow .3s;align-self:start}
.seat.on{border-color:var(--pc);box-shadow:0 0 0 4px color-mix(in srgb,var(--pc) 40%,transparent),0 4px 0 rgba(0,0,0,.25)}
.plate{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:10px}
.ava{width:40px;height:40px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font:800 20px "Baloo 2",sans-serif;box-shadow:0 2px 0 rgba(0,0,0,.3);flex:none}
.plate h3{font-size:22px}
.pill{font-size:13px;font-weight:800;padding:1px 9px;border-radius:99px;background:rgba(60,40,20,.12)}
.pill.think{background:var(--pc);color:#fff;animation:blink 1s infinite alternate}
@keyframes blink{to{opacity:.55}}
.backs{display:flex;padding-left:8px}.backs i{width:20px;height:28px;margin-left:-8px;border-radius:4px;border:1.5px solid #6c421f;background:repeating-linear-gradient(45deg,#e0ad4b 0 4px,#c88f2c 4px 8px);transform:rotate(calc((var(--i) - 1.5)*9deg));box-shadow:0 1px 2px rgba(0,0,0,.3)}
.herds{display:flex;flex-wrap:wrap;gap:12px 10px;align-items:flex-end;min-height:calc(var(--h) + 16px)}
.slots{display:grid;grid-template-columns:repeat(var(--cols),calc(var(--w) + 16px));gap:10px 8px;justify-content:start}
.slot{position:relative;width:calc(var(--w) + 16px);height:calc(var(--h) + 16px)}
.slot>.herd{position:absolute;left:0;bottom:0}
.slot.empty::before{content:"";position:absolute;left:0;bottom:0;width:var(--w);height:var(--h);border:2px dashed rgba(108,66,31,.28);border-radius:calc(var(--w)*.14);background:rgba(108,66,31,.04)}
.bplate{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"ava name pts" "ava backs jks";gap:2px 10px;align-items:center;margin-bottom:10px}
.bplate .ava{grid-area:ava}.bplate h3{grid-area:name;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bplate .pill{grid-area:pts;min-width:52px;text-align:center}.bplate .backs{grid-area:backs}.bplate .jks{grid-area:jks}
.backs i.no{visibility:hidden}
.seat.on .ava{animation:ring 1s ease-in-out infinite alternate}
@keyframes ring{to{box-shadow:0 0 0 6px color-mix(in srgb,var(--pc) 45%,transparent)}}
.mat{--w:clamp(38px,5.4vh,56px);--h:calc(var(--w)*1.4)}
.empty{color:var(--muted);font-size:14px;align-self:center;font-style:italic}
.jks{display:flex;gap:6px;--w:34px;--h:48px}

/* ---- cartes ---- */
.card{--c:#888;position:relative;width:var(--w);height:var(--h);border-radius:calc(var(--w)*.14);background:#fffaf0;border:2px solid color-mix(in srgb,var(--c) 70%,#000);padding:3px;display:flex;flex-direction:column;box-shadow:0 2px 0 rgba(0,0,0,.25),0 5px 10px rgba(0,0,0,.2);user-select:none;flex:none;color:var(--ink)}
.card .art{flex:1;border-radius:calc(var(--w)*.1);display:grid;place-items:center;font-size:calc(var(--w)*.5);line-height:1;
background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 18%,#fff) 0,color-mix(in srgb,var(--c) 60%,#fff) 100%)}
.card .nm{font-weight:800;text-align:center;font-size:calc(var(--w)*.13 + 3px);line-height:1.25;color:color-mix(in srgb,var(--c) 75%,#000);white-space:nowrap;overflow:hidden}
.card .tot{position:absolute;top:calc(var(--w)*.06);left:calc(var(--w)*.06);min-width:calc(var(--w)*.26);height:calc(var(--w)*.26);border-radius:99px;background:var(--c);color:#fff;font-size:calc(var(--w)*.15);font-weight:800;display:grid;place-items:center}
.card.mini .nm,.card.mini .tot{display:none}
.card.back{background:repeating-linear-gradient(45deg,#e0ad4b 0 6px,#c88f2c 6px 12px);border-color:#6c421f}
.card.back .art{background:none;font-size:calc(var(--w)*.4)}
.card.used{filter:grayscale(1);opacity:.35}
.herd{--l:0;position:relative;padding-top:calc(var(--l)*5px);padding-right:calc(var(--l)*5px)}
.herd .under{position:absolute;width:var(--w);height:var(--h);border-radius:calc(var(--w)*.14);background:#fffaf0;border:2px solid color-mix(in srgb,var(--c) 70%,#000);top:calc((var(--l) - var(--k))*5px);left:calc(var(--k)*5px)}
.cnt{position:absolute;top:-8px;right:-8px;background:var(--ink);color:var(--cream);font-weight:800;font-size:13px;border-radius:99px;min-width:24px;text-align:center;line-height:24px;border:2px solid var(--linen);z-index:2}
.dogtag{position:absolute;top:-10px;left:-10px;z-index:3;transform:rotate(-14deg);--w:28px;--h:38px}
.target{cursor:pointer;border-radius:12px;outline:3px dashed var(--red);outline-offset:5px;animation:pulse .9s ease-in-out infinite alternate}
.chosen{outline:3px solid var(--gold);outline-offset:5px;border-radius:12px}
@keyframes pulse{to{outline-color:transparent}}
.flash{animation:land .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes land{0%{transform:translateY(-40px) rotate(-8deg) scale(1.15);opacity:0}100%{transform:none;opacity:1}}

/* ---- centre ---- */
.mid{grid-area:mid;display:grid;grid-template-columns:auto auto;gap:10px 18px;align-content:center;justify-content:center;justify-items:center;align-items:end;text-align:center;padding:4px}
.mid .bubble{grid-column:1/-1;grid-row:2}
.piles{display:flex;gap:26px;align-items:flex-end;--w:clamp(40px,5.6vh,58px);--h:calc(var(--w)*1.4)}
.piles .card.back{box-shadow:2px 2px 0 #6c421f,4px 4px 0 #8e5a2e,6px 6px 0 #6c421f,0 10px 16px rgba(0,0,0,.35)}
.piles>div{width:calc(var(--w) + 34px);display:flex;flex-direction:column;align-items:center}
.piles small{font-variant-numeric:tabular-nums;white-space:nowrap;display:block;font-size:13px;font-weight:800;margin-top:8px;color:var(--cream);text-shadow:0 1px 2px #000}
.disc{width:var(--w);height:var(--h);border-radius:9px;border:2px dashed rgba(255,240,210,.5);display:grid;place-items:center;font-weight:800;font-size:20px}
.bubble{background:var(--cream);color:var(--ink);border-radius:16px;padding:8px 14px;font:600 18px/1.2 "Baloo 2",sans-serif;box-shadow:0 4px 0 rgba(0,0,0,.3);width:320px;height:calc(2.4em + 16px);display:grid;place-items:center;overflow:hidden;text-wrap:balance}
.bubble.final{background:var(--red);color:#fff}
.trick{--w:clamp(42px,6vh,64px);--h:calc(var(--w)*1.4);width:calc(2*var(--w) + 70px);height:calc(var(--h) + 38px)}
.trick .who{display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;font-size:13px;margin-bottom:8px;background:var(--cream);border-radius:99px;padding:1px 12px}
.trick .cards{display:flex;gap:8px;justify-content:center}
.trick .card{animation:land .6s cubic-bezier(.2,1.4,.4,1)}
.trick .card:nth-child(2){transform:rotate(6deg)}.trick .card:first-child{transform:rotate(-4deg)}

/* ---- moi ---- */
.me{grid-area:me;display:flex;flex-direction:column;gap:6px}
.me .seat{align-self:stretch;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.me .plate{flex-direction:column;align-items:flex-start;margin:0;gap:4px;width:136px;flex:none}
.me .plate h3{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me .plate .pill{white-space:nowrap}
.me .merow{flex:1}
.handrow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:8px 28px}
.handrow .acts{display:grid;grid-template-columns:repeat(2,190px);gap:8px;margin:0 0 6px}
.handrow .acts button{width:100%;white-space:nowrap;font-size:15px;padding-inline:8px}
.merow{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-end}
.myjk{display:flex;gap:10px;--w:clamp(40px,5.6vh,58px);--h:calc(var(--w)*1.4);align-items:flex-end}
.myjk .card{cursor:pointer}.myjk .card.off{cursor:default;opacity:.5}
.myjk .card.sel{transform:translateY(-8px);box-shadow:0 0 0 3px var(--gold),0 8px 14px rgba(0,0,0,.3)}
.lbl{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px}
.hand{display:flex;justify-content:center;width:calc(4*var(--w) + 34px);padding:14px 20px 0;--w:clamp(56px,9vh,88px);--h:calc(var(--w)*1.4);min-height:calc(var(--h) + 16px)}
.hand .card{margin:0 -6px;transform:rotate(var(--r)) translateY(var(--y));transition:transform .18s;cursor:pointer;transform-origin:50% 120%}
.hand .card:not(.off):hover{transform:rotate(var(--r)) translateY(calc(var(--y) - 14px))}
.hand .card.off{filter:brightness(.82);cursor:default}
.hand .card.sel,.hand .card.pick{transform:rotate(0) translateY(-26px);box-shadow:0 0 0 4px var(--gold),0 12px 20px rgba(0,0,0,.4);z-index:2}
.hand .card.pick{box-shadow:0 0 0 4px #9aa,0 12px 20px rgba(0,0,0,.4)}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}

/* ---- tableau noir ---- */
.board{margin-top:12px;background:radial-gradient(ellipse at 30% 20%,#33463b,var(--chalk));border:8px solid #7a4e26;border-radius:10px;padding:6px 14px 8px;box-shadow:inset 0 0 30px rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.4);font-family:"Patrick Hand",cursive;color:#f1efe6}
.board .cap{text-align:left;font-family:"Patrick Hand",cursive;font-size:21px;white-space:nowrap}
.board h2{font-family:"Patrick Hand",cursive;font-size:21px;font-weight:400;margin-bottom:4px}
.board .sub{font-size:16px;opacity:.75}
.scroll{overflow-x:auto}
.maj{border-collapse:collapse;width:100%;font-size:18px;line-height:1.2}
.board .maj th small{display:inline;margin-left:2px}
.maj th,.maj td{padding:1px 6px;text-align:center;border-bottom:1px solid rgba(241,239,230,.18)}
.maj th{font-weight:400;font-size:18px;font-family:Nunito,sans-serif}.maj th small{display:block;font-size:12px;opacity:.6}
.maj td:first-child{text-align:left;white-space:nowrap;color:var(--pc)}
.maj td.lead span{display:inline-block;min-width:30px;border:2px solid var(--gold);border-radius:50% 45% 50% 40%;color:var(--gold)}
.maj td.pts{font-size:22px;color:var(--gold)}

/* ---- carnet ---- */
.carnet{position:sticky;top:12px;height:calc(100vh - 24px);min-height:520px;display:flex;flex-direction:column;background:#fbf5e3;color:var(--ink);border-radius:6px 14px 14px 6px;box-shadow:0 14px 30px rgba(0,0,0,.5),inset 6px 0 0 #d8c9a3;overflow:hidden}
.carnet h2{font-family:"Patrick Hand",cursive;font-weight:400;font-size:28px;padding:12px 16px 6px 44px;border-bottom:2px solid #e3a6a0}
#log{list-style:none;margin:0;padding:6px 12px 20px 44px;overflow:auto;flex:1;font-size:15px;line-height:26px;
background:repeating-linear-gradient(#fbf5e3 0 25px,#cfe0ea 25px 26px);background-attachment:local;position:relative}
#log li{position:relative}
#log li b{color:var(--pc)}
#log li.turn{font-family:"Patrick Hand",cursive;font-size:19px;color:var(--pc);margin-top:6px}
#log li.turn::before{content:"";position:absolute;left:-26px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--pc)}
#log li.sys{font-weight:800;color:var(--red)}
#log li.new{animation:ink .6s ease-out}
@keyframes ink{from{background:#ffe9a8}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.ov{position:fixed;inset:0;background:rgba(15,10,5,.65);display:grid;place-items:center;padding:16px;z-index:9}
.ov[hidden]{display:none}
.box{background:var(--cream);color:var(--ink);border-radius:20px;padding:22px;max-width:660px;width:100%;max-height:90vh;overflow:auto;border:4px solid var(--woodd)}
.box h2{font-size:36px;margin-bottom:6px;color:var(--red)}
.box .maj{font-family:Nunito,sans-serif;font-size:16px}.box .maj td,.box .maj th{border-color:#d9caa0}
.box .maj td.lead{background:#f7dd94;font-weight:800}
.box ul{padding-left:20px}.note{font-size:14px;color:#6d5f4a}

.ava{overflow:hidden}.ava img{width:100%;height:100%;object-fit:cover}
.intro{position:fixed;inset:0;z-index:20;overflow:auto;color:var(--ink);display:grid;place-items:center;padding:20px;
background:radial-gradient(circle at 80% 15%,#fff6c8 0,transparent 30%),linear-gradient(115deg,#73bfe9 0%,#bfe3f2 38%,#f6e27a 68%,#f0c33f 100%)}
.intro[hidden]{display:none}
.iwrap{width:min(1120px,100%);display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:28px;align-items:center}
.logo{font:800 clamp(52px,7.5vw,104px)/.88 "Baloo 2",sans-serif;color:#fff4d6;-webkit-text-stroke:3px #6c421f;paint-order:stroke fill;text-shadow:0 7px 0 #6c421f;transform:rotate(-5deg);margin-bottom:22px}
.tag{font:700 20px/1.35 Nunito,sans-serif;color:#4a2f14;max-width:26ch}
.parade{display:flex;flex-wrap:wrap;gap:4px;font-size:34px;margin-top:10px}
.parade span{animation:hop 1.6s ease-in-out infinite;animation-delay:calc(var(--d,0)*1s)}
.parade span:nth-child(2n){--d:.2}.parade span:nth-child(3n){--d:.45}.parade span:nth-child(5n){--d:.7}
@keyframes hop{0%,60%,100%{transform:none}30%{transform:translateY(-12px) rotate(-6deg)}}
.ipanel{background:#fffaf0;border-radius:26px;padding:18px 20px;border:4px solid #6c421f;box-shadow:0 10px 0 #6c421f,0 24px 40px rgba(80,50,10,.35);display:grid;gap:12px}
.istep h2{font-size:22px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.istep h2 i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:17px}
.istep h2 span{font:800 14px Nunito,sans-serif;color:var(--muted)}
.who{display:flex;gap:16px;align-items:center}.whoR{flex:1;display:grid;gap:8px}
.photo{width:108px;height:108px;border-radius:50%;background:#e8dcc0;border:4px solid #3b82c4;overflow:hidden;display:grid;place-items:center;font-size:48px;flex:none}
.photo img,.photo video{width:100%;height:100%;object-fit:cover}.photo video{transform:scaleX(-1)}
input[type=text]{font:inherit;font-size:18px;font-weight:700;min-height:48px;border-radius:12px;border:2px solid #6c421f;padding:6px 12px;width:100%;background:#fff;color:var(--ink)}
.pbtns{display:flex;flex-wrap:wrap;gap:8px}
.filebtn{font-weight:800;border-radius:12px;border:2px solid #3b2614;background:var(--cream);color:var(--ink);min-height:44px;padding:6px 14px;cursor:pointer;box-shadow:0 3px 0 #3b2614;display:inline-flex;align-items:center}
.hint{margin:0;font-size:13px;color:#8a4a1f;min-height:0}
.chips{display:flex;gap:8px}.chips button{min-width:56px;font-size:20px}.chips button.on{background:var(--red);color:#fff}
.chars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
button.char{position:relative;border-radius:16px;border:3px solid #e2d3ab;background:#fff;padding:10px 8px;text-align:center;color:var(--ink);box-shadow:0 4px 0 #e2d3ab;font-weight:400;transition:transform .15s}
button.char.on{border-color:var(--cc);box-shadow:0 0 0 2px var(--cc),0 6px 0 var(--cc);transform:translateY(-4px)}
.char .face{width:62px;height:62px;border-radius:50%;background:var(--cc);display:grid;place-items:center;font-size:34px;margin:0 auto 6px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.char b{font:800 19px/1.1 "Baloo 2",sans-serif;display:block}
.char .lvl{font-size:12px;font-weight:800;color:var(--cc);display:block;margin-top:2px}
.char p{font-size:12.5px;margin:4px 0 0;line-height:1.3;color:#5c4d36}
.char .ck{position:absolute;top:6px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--cc);color:#fff;font-weight:800;display:none;place-items:center;font-size:14px}
.char.on .ck{display:grid}
.ipanel .chk{font-size:14px;font-weight:700}
.go{font-size:24px;min-height:60px;width:100%;font-family:"Baloo 2",sans-serif}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.box.end{max-width:760px;text-align:center;background:linear-gradient(#fff8e4,#f6ecd2)}
.box.end h2{font-size:clamp(30px,5vw,46px)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:22px 0 8px}
.pod{display:flex;flex-direction:column;align-items:center;width:min(170px,30%)}
.pava{width:70px;height:70px;border-radius:50%;background:var(--pc);border:4px solid #fff;display:grid;place-items:center;font-size:34px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.3);color:#fff;font-weight:800;position:relative;animation:pop .5s .8s both cubic-bezier(.2,1.6,.4,1)}
.pava img{width:100%;height:100%;object-fit:cover}
.pod.r1 .pava{width:96px;height:96px;font-size:46px}

  <h2>Règles en bref</h2>
  <ul>
    <li>But : être majoritaire dans le plus d'élevages possible. Un élevage = une seule espèce, jamais deux élevages de la même espèce.</li>
    <li>Élevages max : 7 à 2 joueurs, 6 à 3–4 joueurs, 5 à 5 joueurs.</li>
    <li>À ton tour : 1 ou 2 cartes. Deux cartes bétail seulement si elles sont de la même espèce ; les autres combinaisons (Chacal, Joker, bétail) sont permises. Puis on repioche jusqu'à 4 cartes.</li>
    <li>Ou bien : défausser 1 ou 2 cartes identiques et en repiocher autant (fin du tour).</li>
    <li>Chacal : retire une carte bétail d'un élevage adverse ; les deux cartes vont à la défausse.</li>
    <li>Renard (1 fois) : échange une de tes cartes bétail contre une carte bétail d'un adversaire.</li>
    <li>Chien de garde (1 fois) : protège un de tes élevages contre Chacal et Renard, mais le bloque jusqu'à la fin.</li>
    <li>Pioche vide : chacun joue un dernier tour, y compris celui qui a pris la dernière carte. Puis 1 point par espèce au(x) majoritaire(s), égalités comprises.</li>
  </ul>
  <p class="note">Choix d'interprétation : les 8 Chacals sont mélangés au bétail dans la pioche ; un Joker peut être joué seul ; le Chien se pose sur un de ses propres élevages ; la limite d'élevages vaut pour les deux joueurs lors d'un échange au Renard ; un élevage vidé par un Chacal libère sa place.</p>
  <div class="acts"><button class="main" data-act="close">Compris</button></div>

<script>
{
const SP=[
 {n:'Cheval',pl:'Chevaux',t:4,e:'🐴',c:'#7d5bb5'},
 {n:'Vache',pl:'Vaches',t:5,e:'🐄',c:'#5b5b5b'},
 {n:'Mouton',pl:'Moutons',t:6,e:'🐑',c:'#5f86a6'},

 {n:'Cochon',pl:'Cochons',t:8,e:'🐖',c:'#d9649a'},
 {n:'Lapin',pl:'Lapins',t:9,e:'🐇',c:'#2f9488'},
 {n:'Canard',pl:'Canards',t:10,e:'🦆',c:'#3e8a3a'},
 {n:'Poule',pl:'Poules',t:11,e:'🐔',c:'#c8402f'},
 {n:'Poussin',pl:'Poussins',t:12,e:'🐤',c:'#e39a12'}];
const CHARS=[
 {id:'skinner',name:'SkinR',lvl:0,e:'🐔',c:'#e0961a',tag:'★ Débutant',desc:'Joue un peu au hasard et oublie souvent ses Jokers.'},
 {id:'nico',name:'Nicodrën',lvl:1,e:'🐄',c:'#4f9a3c',tag:'★★ Moyen',desc:'Pose ses bêtes avec bon sens, sans trop calculer.'},
 {id:'tan',name:'Than',lvl:2,e:'🦊',c:'#9a5cc6',tag:'★★★ Costaud',desc:'Combine ses cartes et sort le Chacal au bon moment.'},
 {id:'tipim',name:'Tipim',lvl:3,e:'🐺',c:'#d0503a',tag:'★★★★ Redoutable',desc:'Calcule chaque coup. Gare à tes élevages !'}];
const LV=[{noise:.7,top:2,jok:.3},{noise:.25,top:4,jok:.7},{noise:.06,top:10,jok:1},{noise:0,top:30,jok:1}];
/* Réglages venant de l'Administration du site La Brévinoise (Jeux en ligne › Gare au Chacal) */
const CFG=(()=>{let d={},s=null;try{d=(window.BREV_DEFAULTS.navGames||[]).find(g=>g.id==='gac')||{}}catch(e){}
  try{const st=JSON.parse(localStorage.getItem('brevinoise-site')||'null');s=st&&st.navGames&&st.navGames.find(g=>g.id==='gac')}catch(e){}
  const c=Object.assign({},d,s||{});c.av=Object.assign({},d.av,s&&s.av);c.cards=Object.assign({},d.cards,s&&s.cards);c.bots=(s&&s.bots)||d.bots||[];return c})();
CFG.bots.forEach(b=>{const c=CHARS.find(x=>x.id===b.id);if(!c)return;if(b.name)c.name=b.name;if(b.desc)c.desc=b.desc;if(b.tag)c.tag=b.tag});
const SHOP=CFG.shopUrl||'https://www.sandramoreiraeditions.com';
const SHOPHOST=(()=>{try{return new URL(SHOP).hostname.replace(/^www\./,'')}catch(e){return SHOP}})();
const AV=id=>CUST.av[id]||CFG.av[id]||'';
const CI=k=>CUST.cards[k]||CFG.cards[k]||'';
if(CFG.title){document.title=CFG.title}
let SET={name:'',photo:null,nb:2,picks:['skinner','nico'],jokers:true};
try{Object.assign(SET,JSON.parse(localStorage.getItem('gac-set')||'{}'))}catch(e){}
const saveSet=()=>{try{localStorage.setItem('gac-set',JSON.stringify(SET))}catch(e){}};
const col=i=>G.players[i].color;
let CUST={av:{},cards:{},speed:1,table:CFG.table||'miel'};
try{Object.assign(CUST,JSON.parse(localStorage.getItem('gac-custom')||'{}'))}catch(e){}
const SPD=()=>[1.7,1,.45][CUST.speed??1];
function saveCust(){try{localStorage.setItem('gac-custom',JSON.stringify(CUST));return true}catch(e){return false}}
function applyTable(){document.body.classList.remove('tb-sombre','tb-vert','tb-nappe');if(CUST.table!=='miel')document.body.classList.add('tb-'+CUST.table)}
const $=id=>document.getElementById(id);
const tableEl=$('table'),boardEl=$('board'),logEl=$('log'),ov=$('ov'),ovbox=$('ovbox');
let G=null,gid=0;

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const herdOf=(P,s)=>P.herds.find(h=>h.s===s);
const canPlace=(S,P,s)=>{const h=herdOf(P,s);return h?!h.dog:P.herds.length<S.maxH};
const allowedNext=(pl,d)=>!(pl.length>=2||(pl.length===1&&pl[0][0]==='b'&&d[0]==='b'&&d!==pl[0]));
function addTo(P,s,n){let h=herdOf(P,s);if(!h){h={s,n:0,dog:false};P.herds.push(h)}h.n+=n}
function dec(P,s){const h=herdOf(P,s);h.n--;if(h.n<=0)P.herds.splice(P.herds.indexOf(h),1)}
function take(P,t,s){const i=P.hand.findIndex(c=>c.t===t&&(t!=='b'||c.s===s));return P.hand.splice(i,1)[0]}

function foxOK(S,me,s1,q,s2){
  const P=S.players[me],Q=S.players[q];
  const p2=herdOf(P,s2);if(p2&&p2.dog)return false;
  if(P.herds.length-(herdOf(P,s1).n===1?1:0)+(p2?0:1)>S.maxH)return false;
  const q1=herdOf(Q,s1);if(q1&&q1.dog)return false;
  if(Q.herds.length-(herdOf(Q,s2).n===1?1:0)+(q1?0:1)>S.maxH)return false;
  return true;
}
function legalActions(S,pi,played){
  const P=S.players[pi],out=[],seen=new Set();
  for(const c of P.hand){
    const d=c.t==='b'?'b'+c.s:'c';if(seen.has(d))continue;seen.add(d);
    if(!allowedNext(played,d))continue;
    if(c.t==='b'){if(canPlace(S,P,c.s))out.push({k:'b',s:c.s,d})}
    else S.players.forEach((Q,q)=>{if(q!==pi)Q.herds.forEach(h=>{if(!h.dog)out.push({k:'c',q,s:h.s,d})})});
  }
  if(S.jokers&&allowedNext(played,'j')){
    if(P.dog)P.herds.forEach(h=>{if(!h.dog)out.push({k:'d',s:h.s,d:'j'})});
    if(P.fox)P.herds.forEach(h1=>{if(h1.dog)return;S.players.forEach((Q,q)=>{if(q===pi)return;Q.herds.forEach(h2=>{
      if(!h2.dog&&h2.s!==h1.s&&foxOK(S,pi,h1.s,q,h2.s))out.push({k:'f',s1:h1.s,q,s2:h2.s,d:'j'})})})});
  }
  return out;
}
function apply(S,pi,a){
  const P=S.players[pi];
  if(a.k==='b'){take(P,'b',a.s);addTo(P,a.s,1)}
  else if(a.k==='c'){take(P,'c');dec(S.players[a.q],a.s);S.gone[a.s]++;S.discN+=2}
  else if(a.k==='d'){P.dog=false;herdOf(P,a.s).dog=true}
  else{P.fox=false;const Q=S.players[a.q];dec(P,a.s1);dec(Q,a.s2);addTo(P,a.s2,1);addTo(Q,a.s1,1)}
}
const snap=S=>({players:S.players.map(p=>({name:p.name,hand:p.hand.slice(),herds:p.herds.map(h=>({...h})),dog:p.dog,fox:p.fox})),
  maxH:S.maxH,gone:S.gone.slice(),discN:S.discN,jokers:S.jokers,deckN:S.deck?S.deck.length:S.deckN,final:S.final??(S.finalLeft!==null)});

/* ---------- IA des bots ---------- */
function evalS(S,me){
  const n=S.players.length,cnt=SP.map(()=>Array(n).fill(0)),U=[];
  S.players.forEach((P,i)=>P.herds.forEach(h=>cnt[h.s][i]=h.n));
  const myHand=S.players[me].hand;
  SP.forEach((sp,s)=>{U[s]=Math.max(0,sp.t-cnt[s].reduce((a,b)=>a+b,0)-S.gone[s]-myHand.filter(c=>c.t==='b'&&c.s===s).length)});
  const jv=S.jokers?(S.final?0:0.08+0.3*Math.min(1,S.deckN/25)):0;
  const soft=S.players.map((P,i)=>{let v=0;
    for(const h of P.herds){const m=h.n;let o=0;for(let j=0;j<n;j++)if(j!==i)o=Math.max(o,cnt[h.s][j]);
      if(m>o)v+=Math.min(1,0.55+0.4*Math.min(1,(m-o)/(1+U[h.s]/3))+(h.dog?0.1:0));
      else if(m===o)v+=h.dog?0.6:0.45;
      else v+=o-m>=3?0.02:0.12;
      v-=0.06}
    return v+jv*((P.dog?1:0)+(P.fox?1:0))});
  let mo=-1e9,sum=0;soft.forEach((v,i)=>{if(i!==me){mo=Math.max(mo,v);sum+=v}});
  return soft[me]-0.5*mo-0.25*sum/(n-1);
}
function staticPlan(pi,L={noise:.03,top:12,jok:1},keep=0){
  const P=G.players[pi],S0=snap(G);
  if(Math.random()>L.jok)S0.jokers=false;
  const base=evalS(S0,pi),all=[];
  let best={e:-1e9,seq:[]};
  const f=legalActions(S0,pi,[]).map(a=>{const S1=snap(S0);apply(S1,pi,a);return{a,S1,e:evalS(S1,pi)+Math.random()*(0.02+L.noise)}}).sort((x,y)=>y.e-x.e);
  for(const x of f){all.push({e:x.e,seq:[x.a]});if(x.e>best.e)best={e:x.e,seq:[x.a]}}
  for(const x of f.slice(0,L.top))for(const b of legalActions(x.S1,pi,[x.a.d])){
    const S2=snap(x.S1);apply(S2,pi,b);const e=evalS(S2,pi)+Math.random()*(0.02+L.noise);all.push({e,seq:[x.a,b]});if(e>best.e)best={e,seq:[x.a,b]}}
  const gain=best.e-base;let plan;
  if(G.finalLeft!==null)plan=best.seq.length&&gain>0?{seq:best.seq}:{pass:true};
  else if(best.seq.length&&gain>0.03)plan={seq:best.seq};
  else if(P.hand.length)plan={discard:pickDiscard(S0,pi)};
  else plan=best.seq.length&&gain>0?{seq:best.seq}:{pass:true};
  if(keep)return{plan,cands:all.sort((x,y)=>y.e-x.e).slice(0,keep)};
  return plan;
}
/* Politique rapide à base de règles (Nico Dren, et simulation des parties pour Tipim) */
function fastPlan(S,pi){
  const P=S.players[pi],n=S.players.length,fin=S.finalLeft!==null;
  const cnt=(s,i)=>{const h=herdOf(S.players[i],s);return h?h.n:0};
  const mx=(s,ex)=>{let o=0;for(let j=0;j<n;j++)if(j!==ex)o=Math.max(o,cnt(s,j));return o};
  let best=null,bg=fin?0:0.05;const seen={};
  for(const c of P.hand){
    if(c.t!=='b'||seen[c.s])continue;seen[c.s]=1;if(!canPlace(S,P,c.s))continue;
    const k=Math.min(2,P.hand.filter(x=>x.t==='b'&&x.s===c.s).length),m=cnt(c.s,pi),o=mx(c.s,pi);
    const f=v=>v>o?1:v===o&&v>0?.5:.04*v;
    let g=f(m+k)-f(m)+.03*k;if(m===0&&P.herds.length>=S.maxH-1)g-=.2;if(m===0&&o>=3)g-=.15;
    if(g>bg){bg=g;best={seq:Array(k).fill({k:'b',s:c.s,d:'b'+c.s})}}
  }
  if(P.hand.some(c=>c.t==='c'))S.players.forEach((Q,q)=>{if(q===pi)return;for(const h of Q.herds){if(h.dog)continue;
    const o=h.n,r=mx(h.s,q),m=cnt(h.s,pi);let g=.02;
    if(o>r&&o-1<=r)g=.55;if(m<o&&m>=o-1&&m===r)g+=.35;
    if(g>bg){bg=g;best={seq:[{k:'c',q,s:h.s,d:'c'}]}}}});
  if(best)return best;
  if(fin||!P.hand.length)return{pass:true};
  const dead=P.hand.findIndex(c=>c.t==='b'&&!canPlace(S,P,c.s));
  return{discard:[dead>=0?dead:(Math.random()*P.hand.length|0)]};
}
function randomPlan(pi){
  const acts=legalActions(G,pi,[]),P=G.players[pi];
  if(!acts.length||Math.random()<.15)return P.hand.length?{discard:[Math.random()*P.hand.length|0]}:{pass:true};
  return{seq:[acts[Math.random()*acts.length|0]]};
}
/* Tipim : simulations Monte-Carlo de la fin de partie */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function cloneSim(S){return{players:S.players.map(p=>({hand:p.hand.slice(),herds:p.herds.map(h=>({...h})),dog:p.dog,fox:p.fox})),deck:S.deck.slice(),gone:S.gone.slice(),discN:0,maxH:S.maxH,jokers:S.jokers,finalLeft:S.finalLeft,cur:S.cur,done:false}}
function endSim(S){
  const P=S.players[S.cur],n=S.players.length;
  if(S.finalLeft!==null){P.hand.forEach(c=>{if(c.t==='b')S.gone[c.s]++});P.hand=[];if(--S.finalLeft<=0){S.done=true;return}}
  else{while(P.hand.length<4&&S.deck.length)P.hand.push(S.deck.pop());if(!S.deck.length)S.finalLeft=n}
  S.cur=(S.cur+1)%n;
}
function execSim(S,pi,plan){
  if(plan.seq)plan.seq.forEach(a=>apply(S,pi,a));
  else if(plan.discard){const P=S.players[pi];plan.discard.slice().sort((a,b)=>b-a).forEach(i=>{const c=P.hand.splice(i,1)[0];if(c&&c.t==='b')S.gone[c.s]++})}
  endSim(S);
}
function simScore(S,pi){
  const n=S.players.length,pts=Array(n).fill(0);
  SP.forEach((sp,s)=>{const c=S.players.map(P=>herdOf(P,s)?.n||0),m=Math.max(...c);if(m>0)c.forEach((v,i)=>{if(v===m)pts[i]++})});
  const m=Math.max(...pts),w=pts.filter(x=>x===m).length;let mo=0;pts.forEach((v,i)=>{if(i!==pi)mo=Math.max(mo,v)});
  return(pts[pi]===m?1/w:0)+.12*(pts[pi]-mo);
}
function mcPlan(pi){
  const{plan,cands}=staticPlan(pi,{noise:0,top:30,jok:1},10),P=G.players[pi];
  const list=cands.map(c=>({seq:c.seq}));
  const kinds=[...new Set(P.hand.map(c=>c.t==='b'?'b'+c.s:'c'))];
  if(G.finalLeft===null)for(const k of kinds){const idx=P.hand.map((c,i)=>(c.t==='b'?'b'+c.s:'c')===k?i:-1).filter(i=>i>=0);
    list.push({discard:[idx[0]]});if(idx.length>1)list.push({discard:[idx[0],idx[1]]})}
  else list.push({pass:true});
  if(!list.length)return plan;
  const R=Math.max(12,Math.min(40,Math.round(500/list.length))),n=G.players.length,score=list.map(()=>0);
  for(let r=0;r<R;r++){
    const rand=rng(r*7919+G.deck.length*31+pi);
    const base={players:G.players.map(p=>({hand:p.hand.slice(),herds:p.herds.map(h=>({...h})),dog:p.dog,fox:p.fox})),deck:G.deck.slice(),gone:G.gone.slice(),maxH:G.maxH,jokers:G.jokers,finalLeft:G.finalLeft,cur:pi};
    const pool=base.deck.slice();base.players.forEach((p,i)=>{if(i!==pi)pool.push(...p.hand)});
    for(let i=pool.length-1;i>0;i--){const j=rand()*(i+1)|0;[pool[i],pool[j]]=[pool[j],pool[i]]}
    base.players.forEach((p,i)=>{if(i!==pi)p.hand=pool.splice(0,p.hand.length)});base.deck=pool;
    list.forEach((c,ci)=>{
      const S=cloneSim(base);execSim(S,pi,c);let guard=0;
      while(!S.done&&guard++<400)execSim(S,S.cur,fastPlan(S,S.cur));
      score[ci]+=simScore(S,pi);
    });
  }
  let bi=0;score.forEach((v,i)=>{if(v>score[bi])bi=i});
  return list[bi];
}
function botPlan(pi){
  const lvl=G.players[pi].lvl??3;
  if(lvl===0)return Math.random()<.6?randomPlan(pi):fastPlan(G,pi);
  if(lvl===1)return fastPlan(G,pi);
  if(lvl===2)return staticPlan(pi);
  return mcPlan(pi);
}
function pickDiscard(S,pi){
  const P=S.players[pi],dead=[];
  P.hand.forEach((c,i)=>{const isDead=c.t==='b'?!canPlace(S,P,c.s):!S.players.some((Q,q)=>q!==pi&&Q.herds.some(h=>!h.dog));if(isDead)dead.push(i)});
  const key=i=>{const c=P.hand[i];return c.t==='b'?'b'+c.s:'c'};
  for(const i of dead){const j=dead.find(k=>k!==i&&key(k)===key(i));if(j!==undefined)return[i,j]}
  if(dead.length)return[dead[0]];
  let worst=0,we=1e9;P.hand.forEach((c,i)=>{const S1=snap(S);const a=legalActions(S1,pi,[]).find(a=>a.d===key(i));let e=-1;if(a){apply(S1,pi,a);e=evalS(S1,pi)}if(e<we){we=e;worst=i}});
  return[worst];
}

function toTrick(pi,c,disc=false){

const actCard=a=>a.k==='b'?{t:'b',s:a.s}:a.k==='c'?{t:'c'}:{t:'j',k:a.k};
function startTurn(){
  if(G.over)return;G.turnNo++;const P=G.players[G.cur],id=G.id;
  addLog(`${G.cur===0?'Ton tour':'Tour de '+P.name}${G.finalLeft!==null?' (dernier tour)':''}`,G.cur,'turn');
  if(!P.hand.length&&!legalActions(G,G.cur,[]).length){addLog(`${nm(G.cur)} n'a plus rien à jouer et passe.`,G.cur);render();setTimeout(()=>{if(G.id===id)endTurn()},800);return}

}
function playAction(pi,a){apply(G,pi,a);G.played.push(a.d);toTrick(pi,actCard(a));
  G.flash=a.k==='c'||a.k==='f'?{p:a.q,s:a.k==='c'?a.s:a.s1}:{p:pi,s:a.s};addLog(`${nm(pi)} ${describe(pi,a)}`,pi)}
function botTurn(pi){
  const plan=botPlan(pi),id=G.id;
  if(plan.seq){let k=0;const step=()=>{if(G.id!==id)return;
      if(k<plan.seq.length){playAction(pi,plan.seq[k++]);render();setTimeout(step,1300*SPD())}
      else endTurn()};step()}

}
function discardExec(pi,idxs){
  const P=G.players[pi],cards=idxs.sort((a,b)=>b-a).map(i=>P.hand.splice(i,1)[0]);
  cards.forEach(c=>{if(c.t==='b')G.gone[c.s]++;toTrick(pi,c,true)});G.discN+=cards.length;
  const lbl=cards[0].t==='b'?spn(cards[0].s):'🐺 Chacal';

  addLog(`${nm(pi)} se défausse de ${cards.length} × ${lbl}${cards.length===2?` (montrées à ${left})`:''} et repioche.`,pi);
  if(pi!==0){render();const id=G.id;setTimeout(()=>{if(G.id===id)endTurn()},1100*SPD())}else endTurn();
}
function endTurn(){
  const P=G.players[G.cur],n=G.players.length;G.flash=null;
  if(G.finalLeft!==null){G.discN+=P.hand.length;P.hand.forEach(c=>{if(c.t==='b')G.gone[c.s]++});P.hand=[];if(--G.finalLeft<=0)return finish()}
  else{while(P.hand.length<4&&G.deck.length)P.hand.push(G.deck.pop());
    if(!G.deck.length){G.finalLeft=n;addLog('La pioche est vide : chacun joue un dernier tour !',null,'sys')}}
  G.cur=(G.cur+1)%n;G.played=[];G.sel=null;G.discardMode=false;G.picks=[];G.undo=[];
  startTurn();
}
function scores(){

}

let PS=[],fxOn=false;
function boom(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('fx');c.hidden=false;if(c.width!==innerWidth||c.height!==innerHeight){c.width=innerWidth;c.height=innerHeight}
  const cols=['#f2c14e','#c8402f','#3b82c4','#4f9a3c','#e07aa6','#ffffff','#9a5cc6'];
  const ox=c.width*(.3+Math.random()*.4),oy=c.height*(.22+Math.random()*.2);
  for(let k=0;k<170;k++){const a=Math.random()*Math.PI*2,v=3+Math.random()*11;PS.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[k%cols.length],t:0})}
  if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop)}
}
function fxLoop(){
  const c=$('fx'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);
  for(const p of PS){p.vy+=.2;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.t++;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()}
  PS=PS.filter(p=>p.t<260&&p.y<c.height+40);
  if(PS.length)requestAnimationFrame(fxLoop);else{fxOn=false;x.clearRect(0,0,c.width,c.height);c.hidden=true}
}

  if(c.t==='c')return`<div class="card ${cls}" style="--c:#8a6a2c;${sty}" ${attrs} title="Chacal"><span class="art">🐺</span><span class="nm">Chacal</span></div>`;
  if(c.t==='j')return c.k==='d'?`<div class="card ${cls}" style="--c:#3c4a63;${sty}" ${attrs} title="Chien de garde"><span class="tot">★</span><span class="art">🐕</span><span class="nm">Chien</span></div>`
    :`<div class="card ${cls}" style="--c:#d0692a;${sty}" ${attrs} title="Renard"><span class="tot">★</span><span class="art">🦊</span><span class="nm">Renard</span></div>`;
  const sp=SP[c.s];return`<div class="card ${cls}" style="--c:${sp.c};${sty}" ${attrs} title="${sp.n}"><span class="tot">${sp.t}</span><span class="art">${sp.e}</span><span class="nm">${sp.n}</span></div>`;
}
function matHTML(p,acts,cols){
  const cells=G.players[p].herds.map(h=>`<div class="slot">${herdHTML(p,h,acts)}</div>`);
  while(cells.length<G.maxH)cells.push('<div class="slot empty"></div>');
  return`<div class="mat slots" style="--cols:${cols}">${cells.join('')}</div>`;
}
function herdHTML(p,h,acts){
  const sel=G.sel;let tgt='';
  if(sel&&G.cur===0){
    if(p!==0&&sel.k==='c'&&acts.some(a=>a.k==='c'&&a.q===p&&a.s===h.s))tgt=`data-act="tc" data-q="${p}" data-s="${h.s}"`;
    if(p!==0&&sel.k==='f'&&sel.s1!=null&&acts.some(a=>a.k==='f'&&a.s1===sel.s1&&a.q===p&&a.s2===h.s))tgt=`data-act="tf" data-q="${p}" data-s="${h.s}"`;
    if(p===0&&sel.k==='f'&&sel.s1==null&&acts.some(a=>a.k==='f'&&a.s1===h.s))tgt=`data-act="f1" data-s="${h.s}"`;
    if(p===0&&sel.k==='d'&&acts.some(a=>a.k==='d'&&a.s===h.s))tgt=`data-act="td" data-s="${h.s}"`;
  }
  const fl=G.flash&&G.flash.p===p&&G.flash.s===h.s?' flash':'';
  const chosen=p===0&&sel?.k==='f'&&sel.s1===h.s?' chosen':'';
  const l=Math.min(h.n,4)-1,c=SP[h.s].c;
  const uimg=CI('b'+h.s),under=Array.from({length:l},(_,k)=>`<i class="under${uimg?' pic':''}" style="--k:${l-k};--c:${c}${uimg?`;background-image:url(${uimg})`:''}"></i>`).join('');
  return`<div class="herd${tgt?' target':''}${fl}${chosen}" style="--l:${l}" ${tgt} ${tgt?'tabindex="0" role="button"':''} title="${h.n} ${SP[h.s].pl}${h.dog?' (protégé par le Chien)':''}">
    ${under}${cardHTML({t:'b',s:h.s})}<b class="cnt">${h.n}</b>${h.dog?`<span class="dogtag">${cardHTML({t:'j',k:'d'},'mini')}</span>`:''}</div>`;
}
const sortH=P=>P.herds.slice().sort((a,b)=>a.s-b.s);
function statusText(acts){
  if(G.over)return'Partie terminée.';
  const fin=G.finalLeft!==null?' Dernier tour !':'';
  if(G.cur!==0)return`${G.players[G.cur].name} réfléchit…${fin}`;
  const s=G.sel;
  if(G.discardMode)return'Choisis 1 ou 2 cartes identiques à défausser.';
  if(s?.k==='c')return'Chacal : clique sur un élevage adverse.';
  if(s?.k==='f')return s.s1==null?'Renard : choisis l\'animal que tu donnes.':'Renard : choisis l\'animal que tu prends.';
  if(s?.k==='d')return'Chien : choisis l\'élevage à protéger.';
  if(!G.played.length)return(acts.length?'À toi ! Joue 1 ou 2 cartes, ou défausse-toi.':'Aucune carte jouable : défausse-toi.')+fin;
  if(G.played.length===1&&acts.length)return'Une 2ᵉ carte, ou termine ton tour.'+fin;
  return'Termine ton tour.'+fin;
}
let lastLogN=0;
function render(){
  const me=G.players[0],myTurn=G.cur===0&&!G.over,acts=myTurn?legalActions(G,0,G.played):[];
  const{pts,det}=scores(),nb=G.players.length-1;
  const seat=(P,q)=>`<div class="seat ${G.cur===q&&!G.over?'on':''}" style="grid-area:s${q};--pc:${col(q)}">
    <div class="bplate">${ava(q)}<h3>${P.name}</h3>
      <span class="backs" title="${P.hand.length} cartes en main">${[0,1,2,3].map(i=>`<i style="--i:${i}${CI('back')?`;background:#fff url(${CI('back')}) center/cover`:''}" class="${i<P.hand.length?'':'no'}"></i>`).join('')}</span>
      <span class="pill">${pts[q]} pt${pts[q]>1?'s':''}</span>
      ${G.jokers?`<span class="jks">${cardHTML({t:'j',k:'d'},'mini'+(P.dog?'':' used'))}${cardHTML({t:'j',k:'f'},'mini'+(P.fox?'':' used'))}</span>`:''}</div>
    ${matHTML(q,acts,nb===1?G.maxH:Math.ceil(G.maxH/2))}</div>`;
  const tr=G.trick;
  const trick=tr&&tr.cards.length?`<div class="who" style="color:${col(tr.p)}">${tr.p===0?'Tu':G.players[tr.p].name} ${tr.disc?(tr.p===0?'te défausses de':'se défausse de'):(tr.p===0?'joues':'joue')}</div><div class="cards">${tr.cards.map(c=>cardHTML(c)).join('')}</div>`:'';
  const handKey=c=>c.t==='b'?'b'+c.s:'c',H=me.hand.length;
  const hand=me.hand.map((c,i)=>{
    let cls='';const ok=acts.some(a=>a.d===handKey(c)&&a.k!=='d'&&a.k!=='f');
    if(G.discardMode)cls=G.picks.includes(i)?'pick':'';
    else{if(!ok)cls='off';if(G.sel?.k==='c'&&c.t==='c'&&G.sel.i===i)cls='sel'}
    const live=myTurn&&(G.discardMode||ok),m=i-(H-1)/2;
    return cardHTML(c,cls,live?`data-act="hand" data-i="${i}" tabindex="0" role="button"`:'',`--r:${m*6}deg;--y:${Math.abs(m)*8}px`);
  }).join('');
  const canF=acts.some(a=>a.k==='f')&&!G.discardMode,canD=acts.some(a=>a.k==='d')&&!G.discardMode;
  const jk=G.jokers?`<div><div class="lbl">Tes Jokers</div><div class="myjk">
    ${cardHTML({t:'j',k:'d'},(me.dog?'':'used ')+(canD?'':'off ')+(G.sel?.k==='d'?'sel':''),canD?'data-act="jd" tabindex="0" role="button" title="Chien de garde"':'')}
    ${cardHTML({t:'j',k:'f'},(me.fox?'':'used ')+(canF?'':'off ')+(G.sel?.k==='f'?'sel':''),canF?'data-act="jf" tabindex="0" role="button" title="Renard"':'')}</div></div>`:'';
  const pk=G.picks.map(i=>me.hand[i]),pkOK=pk.length===1||(pk.length===2&&handKey(pk[0])===handKey(pk[1]));
  const dm=G.discardMode;
  const buttons=(dm?`<button class="main" data-act="discok" ${pkOK?'':'disabled'}>Valider la défausse</button><button data-act="cancel">Annuler la défausse</button>`
    :`<button class="main" data-act="end" ${myTurn&&(G.played.length||!H)?'':'disabled'}>Terminer le tour</button><button data-act="disc" ${myTurn&&!G.played.length&&H?'':'disabled'}>Se défausser</button>`)
    +`<button data-act="undo" ${myTurn&&!dm&&G.undo.length?'':'disabled'}>Reprendre la carte</button><button data-act="cancel" ${myTurn&&!dm&&G.sel?'':'disabled'}>Désélectionner</button>`;
  tableEl.className='table t'+nb;
  tableEl.innerHTML=G.players.map((P,q)=>q?seat(P,q):'').join('')+`
  <div class="mid">
    <div class="piles"><div>${cardHTML({t:'back'})}<small>Pioche · ${G.deck.length}</small></div><div><div class="disc">${G.discN}</div><small>Défausse</small></div></div>
    <div class="bubble ${G.finalLeft!==null&&!G.over?'final':''}">${statusText(acts)}</div>
    <div class="trick">${trick}</div>
  </div>
  <div class="me">
    <div class="seat ${myTurn?'on':''}" style="--pc:${col(0)}">
      <div class="plate">${ava(0)}<h3>${me.name}</h3><span class="pill">${me.herds.length} / ${G.maxH} élevages</span><span class="pill">${pts[0]} pt${pts[0]>1?'s':''}</span></div>
      <div class="merow">${matHTML(0,acts,G.maxH)}${jk}</div>
    </div>
    <div class="handrow"><div class="hand">${hand||'<span class="empty" style="color:var(--cream)">Main vide</span>'}</div>
    <div class="acts">${buttons}</div></div>
  </div>`;
  boardEl.innerHTML=`<div class="scroll"><table class="maj"><thead><tr><th class="cap" title="Entourés : qui marque le point de l'espèce">Tableau des points</th>${SP.map(sp=>`<th title="${sp.pl} (${sp.t} cartes)">${sp.e}<small>${sp.t}</small></th>`).join('')}<th>Pts</th></tr></thead><tbody>
    ${G.players.map((P,i)=>`<tr><td style="--pc:${col(i)}">${P.name}</td>${det.map(d=>`<td class="${d.w.includes(i)?'lead':''}"><span>${d.c[i]||''}</span></td>`).join('')}<td class="pts">${pts[i]}</td></tr>`).join('')}</tbody></table></div>`;
  const fresh=G.log.length-lastLogN;
  logEl.innerHTML=G.log.map((l,i)=>`<li class="${l.k}${i>=G.log.length-fresh?' new':''}" style="--pc:${l.p==null?'var(--red)':col(l.p)}">${l.h}</li>`).join('');
  lastLogN=G.log.length;logEl.scrollTop=logEl.scrollHeight;if(G.needFit){G.needFit=false;fit()}
}
function fit(){
  const m=$('main'),f=$('fit');f.style.zoom='';
  if(innerWidth<=1080)return;
  for(let k=0;k<4;k++){const need=m.clientHeight/f.getBoundingClientRect().height;if(need>=0.995)break;f.style.zoom=Math.max(0.45,(+f.style.zoom||1)*need)}
}
addEventListener('resize',()=>{if(G)fit()});

/* ---------- Actions du joueur ---------- */
function pushUndo(){G.undo.push(JSON.stringify({players:G.players,gone:G.gone,discN:G.discN,played:G.played,logN:G.log.length,trick:G.trick}))}
function doHuman(a){if(!a)return;pushUndo();playAction(0,a);G.sel=null;render()}
function act(el){
  const a=el.dataset.act;
  if(a==='intro')return showIntro();
  if(a==='cust')return openCust();
  if(a==='cclose'){$('custov').hidden=true;if(G)render();return}
  if(a==='cset'){const k=el.dataset.k;CUST[k]=k==='speed'?+el.dataset.v:el.dataset.v;saveCust();applyTable();return renderCust()}
  if(a==='creset'){const k=el.dataset.k;if(k==='all'){CUST.av={};CUST.cards={};CUST.speed=1;CUST.table='miel';applyTable()}else{const[kind,id]=k.split(':');delete (kind==='av'?CUST.av:CUST.cards)[id]}custMsg='';saveCust();renderCust();renderIntro();return}
  if(a==='cam')return startCam();
  if(a==='snap'){const v=$('photo').querySelector('video');if(v){setPhotoFrom(v,true)}stopCam();$('camhint').textContent='Photo enregistrée !';return}
  if(a==='nbots'){SET.nb=+el.dataset.n;const order=CHARS.map(c=>c.id);while(SET.picks.length>SET.nb)SET.picks.pop();
    for(const id of order){if(SET.picks.length>=SET.nb)break;if(!SET.picks.includes(id))SET.picks.push(id)}saveSet();return renderIntro()}
  if(a==='char'){const id=el.dataset.id,k=SET.picks.indexOf(id);if(k>=0)SET.picks.splice(k,1);else{SET.picks.push(id);if(SET.picks.length>SET.nb)SET.picks.shift()}saveSet();return renderIntro()}
  if(a==='go'){if(SET.picks.length!==SET.nb)return;if(!SET.name){SET.name='Joueur'}SET.picks.sort((x,y)=>CHARS.findIndex(c=>c.id===x)-CHARS.findIndex(c=>c.id===y));saveSet();return newGame()}
  if(a==='new')return newGame();
  if(a==='close'){ov.hidden=true;return}
  if(a==='rules'){ovbox.className='box';ovbox.innerHTML=$('rulesTpl').innerHTML;ov.hidden=false;return}
  if(!G||G.over||G.cur!==0)return;
  const me=G.players[0],acts=legalActions(G,0,G.played),s=+el.dataset.s,q=+el.dataset.q;
  if(a==='hand'){const i=+el.dataset.i,c=me.hand[i];
    if(G.discardMode){const k=G.picks.indexOf(i);if(k>=0)G.picks.splice(k,1);else{G.picks.push(i);if(G.picks.length>2)G.picks.shift()}return render()}
    if(c.t==='b')return doHuman(acts.find(x=>x.k==='b'&&x.s===c.s));
    G.sel=G.sel?.k==='c'?null:{k:'c',i};return render()}
  if(a==='jf'){G.sel=G.sel?.k==='f'?null:{k:'f',s1:null};return render()}
  if(a==='jd'){G.sel=G.sel?.k==='d'?null:{k:'d'};return render()}
  if(a==='f1'){G.sel.s1=s;return render()}
  if(a==='tf')return doHuman(acts.find(x=>x.k==='f'&&x.s1===G.sel.s1&&x.q===q&&x.s2===s));
  if(a==='tc')return doHuman(acts.find(x=>x.k==='c'&&x.q===q&&x.s===s));
  if(a==='td')return doHuman(acts.find(x=>x.k==='d'&&x.s===s));
  if(a==='cancel'){G.sel=null;G.discardMode=false;G.picks=[];return render()}
  if(a==='disc'){G.discardMode=true;G.sel=null;G.picks=[];return render()}
  if(a==='discok')return discardExec(0,G.picks.slice());
  if(a==='undo'){const u=JSON.parse(G.undo.pop());G.players=u.players;G.gone=u.gone;G.discN=u.discN;G.played=u.played;G.trick=u.trick;G.log.length=u.logN;lastLogN=u.logN;G.sel=null;G.flash=null;return render()}
  if(a==='end')return endTurn();
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&!el.disabled)act(el)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('label.filebtn')){e.preventDefault();e.target.querySelector('input').click();return}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-act][role=button]')){e.preventDefault();act(e.target)}});
SET.nb=Math.min(4,Math.max(1,SET.picks.length||2));applyTable();renderIntro();
}
</script>
</body>
